// --- Clock: always India time, blinking colon ---
const fmt = new Intl.DateTimeFormat("en-IN", { timeZone: "Asia/Kolkata", hour: "numeric", minute: "2-digit", hour12: true });
const clock = document.getElementById("clock");
function tick() {
  const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x => [x.type, x.value]));
  clock.innerHTML = `${p.hour}<span class="colon">:</span>${p.minute}<span class="ampm">${p.dayPeriod || ""}</span>`;
}

  night:   { img: "bg-night.jpg",   video: "bg-night.mp4",   sky: "#082654", road: "#312d38" },
};

  layer.style.backgroundImage = `url(${s.img})`;
  const v = document.createElement("video");
  Object.assign(v, { src: s.video, poster: s.img, muted: true, loop: true, autoplay: true, playsInline: true, preload: "auto" });
  v.setAttribute("aria-hidden", "true");
  layer.append(v);
  scene.append(layer);
  const old = [...scene.querySelectorAll(".layer")].filter(l => l !== layer);
  if (first) { layer.classList.add("on"); return; }
  // Fade in once the new still has loaded, then drop the old layer (and its video)
  const img = new Image();
  img.onload = img.onerror = () => {
    void layer.offsetWidth; // commit opacity:0 first so the fade runs (rAF would stall in background tabs)
    layer.classList.add("on");
    setTimeout(() => old.forEach(l => l.remove()), 2100);
  };
  img.src = s.img;
}
applyScene(forced || periodFor(istHour()));
if (!forced) setInterval(() => applyScene(periodFor(istHour())), 60000);

// --- Quotes: short lines from classic Malayalam poetry (all public-domain works), on time passing and song ---
const QUOTES = [
  { period: "night",   lines: ["ആകാശഗംഗയിലാറാടി, യാടിവ-", "ന്നേകയായ്പ്പോകുവതെങ്ങു നീ, മോഹിനീ?"],
    ml: "ചങ്ങമ്പുഴ കൃഷ്ണപിള്ള", en: "Changampuzha Krishna Pillai", role: "Romantic poet (1911–1948) · ‘Poonilavu’" },
  { period: "evening", lines: ["അരുണൻ പടിഞ്ഞാറെക്കൊച്ചു കുന്നിൻ-", "ചെരുവിലല്പാല്പമായ്ത്താണിരുന്നു."],
    ml: "ചങ്ങമ്പുഴ കൃഷ്ണപിള്ള", en: "Changampuzha Krishna Pillai", role: "Romantic poet (1911–1948) · ‘Ramanan’, 1936" },
  { period: "morning", lines: ["അഴകുകണ്ടാനന്ദമാളിയാളി,", "വഴിനീളെപ്പാട്ടുകൾ മൂളിമൂളി,"],
    ml: "ചങ്ങമ്പുഴ കൃഷ്ണപിള്ള", en: "Changampuzha Krishna Pillai", role: "Romantic poet (1911–1948) · ‘Ramanan’, 1936" },
  { period: "day",     lines: ["ഹാ! പുഷ്പമേ, അധികതുംഗപദത്തിലെത്ര", "ശോഭിച്ചിരുന്നിതൊരു രാജ്ഞികണക്കയേ നീ"],
    ml: "കുമാരനാശാൻ", en: "Kumaran Asan", role: "Mahakavi and social reformer (1873–1924) · ‘Veena Poovu’, 1907" },
  { period: null,      lines: ["ഭോഗങ്ങളെല്ലാം ക്ഷണപ്രഭാ ചഞ്ചലം", "വേഗേന നഷ്ടമാമായുസ്സുമോർക്ക നീ"],
    ml: "തുഞ്ചത്ത് എഴുത്തച്ഛൻ", en: "Thunchath Ezhuthachan", role: "Father of the Malayalam language (16th c.) · ‘Adhyatma Ramayanam’" },
];
const quoteEl = document.getElementById("quote");
let qi = Math.max(0, QUOTES.findIndex(q => q.period === (forced || periodFor(istHour()))));
function showQuote() {
  const q = QUOTES[qi];
  document.getElementById("quote-text").innerHTML = q.lines.join("<br>");
  document.getElementById("quote-who").innerHTML = `${q.en} · <span class="ml" lang="ml">${q.ml}</span>`;
  document.getElementById("quote-role").textContent = q.role;
}
showQuote();
setInterval(() => {
  quoteEl.classList.add("fade");
  setTimeout(() => { qi = (qi + 1) % QUOTES.length; showQuote(); quoteEl.classList.remove("fade"); }, 900);
}, 12000);

// --- "Online" count: cosmetic random walk, same as the original (no server) ---
let online = 30;
const countEl = document.getElementById("count");
(function drift() {
  setTimeout(() => {
    const dir = Math.random() < (online < 36 ? .58 : .42) ? 1 : -1;
    online = Math.max(14, Math.min(58, online + dir * (1 + Math.floor(Math.random() * 3))));
    countEl.textContent = online;
    drift();
  }, 2500 + Math.random() * 3500);
})();

// --- Player (hidden YouTube iframe as the audio source) ---
const $ = id => document.getElementById(id);
const ICON_PLAY = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>';
// YouTube button: opens all songs as a playlist in Spotify order (YouTube builds it from the IDs; no login needed)
document.getElementById("yt-link").href = "https://www.youtube.com/watch_videos?video_ids=" + TRACKS.map(t => t.id).join(",");
// Every visit gets a fresh shuffled order (Fisher-Yates), so each song plays once before any repeats
for (let i = TRACKS.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [TRACKS[i], TRACKS[j]] = [TRACKS[j], TRACKS[i]]; }
let idx = 0, yt = null, playing = false;

function render() {
  const t = TRACKS[idx];
  $("title").textContent = t.title;
  $("artist").textContent = t.artist;
  $("cover").src = `https://i.ytimg.com/vi/${t.id}/hqdefault.jpg`;
  $("cover").alt = `${t.title} artwork`;
}
function setPlaying(v) {
  playing = v;
  $("player").classList.toggle("playing", v);
  $("play").innerHTML = v ? ICON_PAUSE : ICON_PLAY;
  $("play").setAttribute("aria-label", v ? "Pause" : "Play");
  $("play").setAttribute("aria-pressed", v);
}
function go(i) {
  idx = (i + TRACKS.length) % TRACKS.length;
  render();
  yt?.loadVideoById(TRACKS[idx].id);
}
// Cover image fails (video removed) -> show the gradient fallback underneath
$("cover").onerror = e => { e.target.removeAttribute("src"); };

window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("ytmount", {
    videoId: TRACKS[idx].id,
    playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1, start: 5 },
    events: {
      onReady: () => { $("play").disabled = false; },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) setPlaying(true);
        else if (e.data === YT.PlayerState.PAUSED) setPlaying(false);
        else if (e.data === YT.PlayerState.ENDED) go(idx + 1);
      },
      // Unplayable/removed video: skip it rather than stall
      onError: () => go(idx + 1),
    },
  });
};

$("play").onclick = () => playing ? yt.pauseVideo() : yt.playVideo();
$("prev").onclick = () => go(idx - 1);
$("next").onclick = () => go(idx + 1);

function seek(frac) {
  const d = yt?.getDuration?.();
  if (d) yt.seekTo(d * Math.min(1, Math.max(0, frac)), true);
}
$("bar").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width); };
$("bar").onkeydown = e => {
  const d = yt?.getDuration?.(), c = yt?.getCurrentTime?.();
  if (!d) return;
  if (e.key === "ArrowRight") seek((c + 5) / d);
  if (e.key === "ArrowLeft") seek((c - 5) / d);
};

const mmss = s => { s = Number.isFinite(s) && s > 0 ? s : 0; return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`; };
setInterval(() => {
  const cur = yt?.getCurrentTime?.() || 0, dur = yt?.getDuration?.() || 0;
  const pct = dur > 0 ? cur / dur * 100 : 0;
  $("fill").style.width = $("knob").style.left = pct + "%";
  $("bar").setAttribute("aria-valuenow", Math.round(pct));
  $("time").textContent = `${mmss(cur)} / ${mmss(dur)}`;
}, 400);

render();
setPlaying(false);
const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(s);
</script>
</body>
</html>
