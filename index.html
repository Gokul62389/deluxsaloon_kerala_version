<style>
  :root { --glass: rgba(255,255,255,.1); --line: rgba(255,255,255,.2); --dim: rgba(255,255,255,.7); --shadow: drop-shadow(0 1px 6px rgba(0,0,0,.5)); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; background: #000; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  /* Background: a 16:9 scene (still image + looping video) that covers the screen.
     Sky and road colours fill any gap when the scene is shrunk on tall phones. */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: linear-gradient(#308de0 0 50%, #9a7c6b 50% 100%); }
  .scene { position: absolute; left: 50%; top: 50%; width: max(100vw, 177.78vh); aspect-ratio: 16 / 9; transform: translate(-50%, -50%);
    background: url(bg.jpg) center / 100% 100% no-repeat; }
  .scene video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Tall phones: covering would crop the signboard (35% of the image width), so size the scene to fit it

  @media (max-aspect-ratio: 5/8) {
    .scene { width: 270vw; top: calc(33vh - 48.9vw); transform: translateX(-50%);
      -webkit-mask-image: linear-gradient(transparent, #000 5%, #000 93%, transparent); mask-image: linear-gradient(transparent, #000 5%, #000 93%, transparent); }

  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.1), transparent 50%, rgba(0,0,0,.4)); }
  @media (prefers-reduced-motion: reduce) { .scene video { display: none; } }
  main { position: relative; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; }
  /* Top bar: one row so clock, online count and links share a centre line and equal side gutters */
  .topbar { --gutter: 24px; --pill-x: 10px; position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: 64px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 12px;
    padding: env(safe-area-inset-top) max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left));
    font-size: 14px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; filter: var(--shadow); }
  #clock { justify-self: start; white-space: nowrap; }
  #clock .ampm { margin-left: 6px; color: var(--dim); }
  #clock .colon { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #online { justify-self: center; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  #online .lbl { color: var(--dim); }
  .dot { position: relative; width: 10px; height: 10px; flex-shrink: 0; }
  .dot::before, .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #4ade80; }
  .dot::before { animation: ping 1s cubic-bezier(0,0,.2,1) infinite; opacity: .75; }
  .dot::after { box-shadow: 0 0 8px rgba(74,222,128,.9); }
  @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
  /* Negative margin cancels the last pill's inner padding so its visible edge sits on the gutter, matching the clock */
  .links { justify-self: end; display: flex; align-items: center; gap: 4px; margin-right: calc(-1 * var(--pill-x)); }
  .pill { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 var(--pill-x); border-radius: 999px; color: #fff; text-decoration: none; white-space: nowrap; transition: opacity .15s, transform .15s; }
  .pill:hover { opacity: .8; } .pill:active { transform: scale(.95); }
  .pill .txt, .pill .arrow { display: none; }
  .pill .arrow { transform: rotate(-45deg); opacity: .5; transition: opacity .15s; }
  .pill:hover .arrow { opacity: .9; }
  /* Text labels only once there's room for them without pushing the centred online count off-centre */
  @media (min-width: 768px) { .topbar { --pill-x: 12px; } .links { gap: 8px; margin-right: calc(3px - var(--pill-x)); } .pill .txt { display: inline; } .pill .arrow { display: inline-flex; } }
  @media (max-width: 420px) { .topbar { --gutter: 16px; } }
  @media (max-width: 340px) { .topbar { --gutter: 12px; --pill-x: 8px; column-gap: 8px; } .links { gap: 0; } }
  /* The name is painted on the shop signboard in the background, so the heading is for screen readers only */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dock { width: 100%; display: flex; justify-content: center; padding: 0 24px; margin-top: auto; margin-bottom: 8vh; }
  #yt { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  .player { width: 100%; max-width: 576px; display: flex; align-items: center; gap: 16px; padding: 12px 20px 12px 12px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(40px) saturate(1.5); -webkit-backdrop-filter: blur(40px) saturate(1.5);
    box-shadow: 0 8px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
  .disc { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
  .disc .art { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 10px 15px rgba(0,0,0,.3);
    animation: spin 8s linear infinite; animation-play-state: paused;
    background: linear-gradient(135deg, #f43f5e, #dc2626, #f59e0b); }
  .playing .disc .art { animation-play-state: running; }
  .disc img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.35); /* crop YouTube letterbox bars */ }
  .disc .hole { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; transform: translate(-50%,-50%); border-radius: 50%; background: rgba(0,0,0,.7); box-shadow: 0 0 0 2px rgba(255,255,255,.4); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .info { flex: 1; min-width: 0; }
  .info p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title { font-size: 15px; font-weight: 600; }
  #artist { font-size: 13px; color: var(--dim); }
  .bar { position: relative; height: 8px; margin-top: 8px; cursor: pointer; }
  .bar .track { position: absolute; left: 0; right: 0; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 999px; background: rgba(255,255,255,.2); overflow: hidden; }
  .bar .fill { height: 100%; width: 0; border-radius: 999px; background: rgba(255,255,255,.9); }
  .bar .knob { position: absolute; top: 50%; left: 0; width: 12px; height: 12px; transform: translate(-50%,-50%); border-radius: 50%; background: #fff; opacity: 0; transition: opacity .15s; }
  .bar:hover .knob, .bar:focus-visible .knob { opacity: 1; }
  #time { margin-top: 6px; font-size: 11px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.6); }
  .ctrls { display: flex; align-items: center; gap: 4px; }
  .ctrls button { display: grid; place-items: center; border-radius: 50%; transition: transform .15s, background .15s; }

  .skip { width: 36px; height: 36px; color: rgba(255,255,255,.8); }

  #play { width: 44px; height: 44px; background: #fff; color: #000; box-shadow: 0 10px 15px rgba(0,0,0,.3); }
  #play:hover:not(:disabled) { transform: scale(1.05); }
  #play:disabled { opacity: .5; cursor: default; }
  #time { white-space: nowrap; }
  /* Small phones: compact player so the title and time stay on one line */
  @media (max-width: 420px) {
    .dock { padding: 0 12px; }
    .player { gap: 10px; padding: 8px 12px 8px 8px; }

    .disc .hole { width: 10px; height: 10px; }

  @media (max-height: 500px) {

  }

// --- Clock: always India time, blinking colon ---
const fmt = new Intl.DateTimeFormat("en-IN", { timeZone: "Asia/Kolkata", hour: "numeric", minute: "2-digit", hour12: true });
const clock = document.getElementById("clock");
function tick() {
  const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x => [x.type, x.value]));
  clock.innerHTML = `${p.hour}<span class="colon">:</span>${p.minute}<span class="ampm">${p.dayPeriod || ""}</span>`;
}
tick(); setInterval(tick, 1000);

// --- "Online" count: cosmetic random walk, same as the original (no server) ---
let online = 30;
const countEl = document.getElementById("count");
(function drift() {
  setTimeout(() => {
    const dir = Math.random() < (online < 36 ? .58 : .42) ? 1 : -1;
    online = Math.max(14, Math.min(58, online + dir * (1 + Math.floor(Math.random() * 3))));
    countEl.textContent = online;
    drift();
  }, 2500 + Math.random() * 3500);
})();

// --- Player (hidden YouTube iframe as the audio source) ---
const $ = id => document.getElementById(id);
const ICON_PLAY = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>';
let idx = 0, yt = null, playing = false;

function render() {
  const t = TRACKS[idx];
  $("title").textContent = t.title;
  $("artist").textContent = t.artist;
  $("cover").src = `https://i.ytimg.com/vi/${t.id}/hqdefault.jpg`;
  $("cover").alt = `${t.title} artwork`;
}
function setPlaying(v) {
  playing = v;
  $("player").classList.toggle("playing", v);
  $("play").innerHTML = v ? ICON_PAUSE : ICON_PLAY;
  $("play").setAttribute("aria-label", v ? "Pause" : "Play");
  $("play").setAttribute("aria-pressed", v);
}
function go(i) {
  idx = (i + TRACKS.length) % TRACKS.length;
  render();
  yt?.loadVideoById(TRACKS[idx].id);
}
// Cover image fails (video removed) -> show the gradient fallback underneath
$("cover").onerror = e => { e.target.removeAttribute("src"); };

window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("ytmount", {
    videoId: TRACKS[idx].id,
    playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1, start: 5 },
    events: {
      onReady: () => { $("play").disabled = false; },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) setPlaying(true);
        else if (e.data === YT.PlayerState.PAUSED) setPlaying(false);
        else if (e.data === YT.PlayerState.ENDED) go(idx + 1);
      },
      // Unplayable/removed video: skip it rather than stall
      onError: () => go(idx + 1),
    },
  });
};

$("play").onclick = () => playing ? yt.pauseVideo() : yt.playVideo();
$("prev").onclick = () => go(idx - 1);
$("next").onclick = () => go(idx + 1);

function seek(frac) {
  const d = yt?.getDuration?.();
  if (d) yt.seekTo(d * Math.min(1, Math.max(0, frac)), true);
}
$("bar").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width); };
$("bar").onkeydown = e => {
  const d = yt?.getDuration?.(), c = yt?.getCurrentTime?.();
  if (!d) return;
  if (e.key === "ArrowRight") seek((c + 5) / d);
  if (e.key === "ArrowLeft") seek((c - 5) / d);
};

const mmss = s => { s = Number.isFinite(s) && s > 0 ? s : 0; return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`; };
setInterval(() => {
  const cur = yt?.getCurrentTime?.() || 0, dur = yt?.getDuration?.() || 0;
  const pct = dur > 0 ? cur / dur * 100 : 0;
  $("fill").style.width = $("knob").style.left = pct + "%";
  $("bar").setAttribute("aria-valuenow", Math.round(pct));
  $("time").textContent = `${mmss(cur)} / ${mmss(dur)}`;
}, 400);

render();
