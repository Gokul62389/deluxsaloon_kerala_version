name: Sync Spotify playlist

# Keeps the player's songs in step with the public Spotify playlist.
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab for an immediate sync

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-playlist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync songs from Spotify
        id: sync
        run: |
          python3 scripts/sync_playlist.py | tee summary.txt
          delim="END_$(openssl rand -hex 8)"   # random marker so no song title can end the block early
          {
            echo "summary<<$delim"
            cat summary.txt
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          rm summary.txt

      - name: Commit if the playlist changed
        id: commit
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}   # passed via env, never pasted into the script (titles come from YouTube)
        run: |
          if git diff --quiet -- index.html; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync playlist from Spotify" -m "$SUMMARY"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the live site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
